<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vesti" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>Vesti — Signing in</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --bg: #fafaf7;
      --ink: #14110f;
      --muted: #6f6a64;
      --line: #e5e1da;
      --err: #a43030;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: calc(32px + var(--safe-top)) calc(20px + var(--safe-right)) calc(32px + var(--safe-bottom)) calc(20px + var(--safe-left));
    }
    .wordmark {
      font-family: "SF Pro Display", -apple-system, serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 32px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      font-size: 15px;
      color: var(--ink);
      line-height: 1.55;
    }
  </style>
  <!-- PWA / Install -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Vesti</div>
    <div class="card">
      <span id="status-msg">Signing you in…</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const statusMsg = document.getElementById("status-msg");

    (async () => {
      const cfg = await fetch("/api/auth-config").then(r => r.ok ? r.json() : null).catch(() => null);
      if (!cfg || !cfg.url || !cfg.anonKey) {
        statusMsg.textContent = "Link expired or invalid — sending you back to sign in.";
        setTimeout(() => { window.location.replace("/login.html?error=invalid_link"); }, 1500);
        return;
      }

      const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: window.localStorage,
          storageKey: "vesti-auth"
        }
      });

      const { data: { session }, error } = await sb.auth.getSession();

      if (!session || error) {
        statusMsg.textContent = "Link expired or invalid — sending you back to sign in.";
        setTimeout(() => {
          window.location.replace("/login.html?error=invalid_link");
        }, 1500);
        return;
      }

      try {
        const res  = await fetch(`/api/get-closet?limit=1`, {
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        const data = await res.json();
        if (data.garments && data.garments.length > 0) {
          window.location.replace("/app.html");
        } else {
          window.location.replace("/onboarding.html");
        }
      } catch (err) {
        console.error("callback: closet fetch failed, defaulting to onboarding", err);
        window.location.replace("/onboarding.html");
      }
    })();
  </script>
</body>
</html>
