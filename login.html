<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vesti" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>Vesti — Sign in</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --bg: #fafaf7;
      --ink: #14110f;
      --muted: #6f6a64;
      --line: #e5e1da;
      --accent: #14110f;
      --accent-soft: #efeae0;
      --ok: #2f7a4a;
      --warn: #b25c1c;
      --err: #a43030;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: calc(32px + var(--safe-top)) calc(20px + var(--safe-right)) calc(32px + var(--safe-bottom)) calc(20px + var(--safe-left));
    }
    .wordmark {
      font-family: "SF Pro Display", -apple-system, serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 32px;
    }
    h1 {
      font-family: "SF Pro Display", -apple-system, serif;
      font-weight: 600;
      font-size: 26px;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .sub {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 20px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    label.field {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
      color: var(--ink);
      -webkit-appearance: none;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: var(--ink);
    }
    input[type="email"].has-error {
      border-color: var(--err);
    }
    .error-text {
      color: var(--err);
      font-size: 13px;
      margin-top: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 18px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--ink); }
    .sent-text {
      font-size: 15px;
      color: var(--ink);
      line-height: 1.55;
      margin: 0 0 4px;
    }
  </style>
  <!-- PWA / Install -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Vesti</div>
    <h1>Sign in to Vesti</h1>
    <p class="sub">We'll email you a magic link — no password.</p>

    <div class="card">

      <div id="form-section">
        <label class="field" for="email-input">Email</label>
        <input type="email" id="email-input"
               placeholder="you@example.com"
               autocomplete="email"
               inputmode="email"
               spellcheck="false" />
        <div id="error-msg" class="error-text" hidden></div>
        <button class="btn" id="submit-btn">Send magic link</button>
      </div>

      <div id="sent-section" hidden>
        <p class="sent-text" id="sent-msg"></p>
        <button class="btn ghost" id="resend-btn" disabled>Resend</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (async () => {
      const cfg = await fetch("/api/auth-config").then(r => r.ok ? r.json() : null).catch(() => null);
      if (!cfg || !cfg.url || !cfg.anonKey) return;

      const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: window.localStorage,
          storageKey: "vesti-auth"
        }
      });

      const emailInput  = document.getElementById("email-input");
      const submitBtn   = document.getElementById("submit-btn");
      const errorMsg    = document.getElementById("error-msg");
      const formSection = document.getElementById("form-section");
      const sentSection = document.getElementById("sent-section");
      const sentMsg     = document.getElementById("sent-msg");
      const resendBtn   = document.getElementById("resend-btn");

      // Same pattern used throughout the app
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      let lastEmail   = "";
      let resendTimer = null;

      function esc(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function clearError() {
        emailInput.classList.remove("has-error");
        errorMsg.hidden = true;
        errorMsg.textContent = "";
      }

      function showError(msg) {
        emailInput.classList.add("has-error");
        errorMsg.textContent = msg;
        errorMsg.hidden = false;
      }

      function showSent(email) {
        formSection.hidden = true;
        sentSection.hidden = false;
        sentMsg.innerHTML =
          "Check your email — we sent a magic link to <strong>" + esc(email) + "</strong>. " +
          "Click the link to sign in. (You can close this tab.)";
        resendBtn.disabled = true;
        clearTimeout(resendTimer);
        resendTimer = setTimeout(() => { resendBtn.disabled = false; }, 30000);
      }

      async function sendOtp(email) {
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin + "/auth/callback.html" }
        });
        return error;
      }

      // ---- Submit handler ----
      submitBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim().toLowerCase();
        clearError();

        if (!EMAIL_RE.test(email)) {
          showError("Please enter a valid email address.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";

        const error = await sendOtp(email);

        submitBtn.disabled = false;
        submitBtn.textContent = "Send magic link";

        if (error) {
          showError(error.message);
        } else {
          lastEmail = email;
          showSent(email);
        }
      });

      // Enter key triggers submit
      emailInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitBtn.click();
      });

      // ---- Resend handler ----
      resendBtn.addEventListener("click", async () => {
        resendBtn.disabled = true;
        clearTimeout(resendTimer);

        // Remove any previous resend error
        const prev = sentSection.querySelector(".resend-error");
        if (prev) prev.remove();

        const error = await sendOtp(lastEmail);

        if (error) {
          const el = document.createElement("p");
          el.className = "resend-error";
          el.style.cssText = "color:var(--err);font-size:13px;margin:8px 0 0;";
          el.textContent = error.message;
          resendBtn.insertAdjacentElement("beforebegin", el);
        }

        // Always reset the 30-second cooldown regardless of outcome
        resendTimer = setTimeout(() => { resendBtn.disabled = false; }, 30000);
      });
    })();
  </script>
  <script>
  (function() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true ||
                       window.matchMedia('(display-mode: standalone)').matches;
    try {
      var dismissed = localStorage.getItem('vesti-install-dismissed') === '1';
      if (!isIOS || isStandalone || dismissed) return;
    } catch (e) { return; }

    var css = '#vesti-install-banner{position:fixed;bottom:0;left:0;right:0;background:#4A6B4E;color:#FAF7F2;padding:14px 16px;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.4;box-shadow:0 -2px 12px rgba(0,0,0,0.12);display:flex;align-items:center;gap:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}#vesti-install-banner .vib-text{flex:1}#vesti-install-banner .vib-text strong{display:block;font-weight:600;margin-bottom:2px}#vesti-install-banner .vib-share{display:inline-block;padding:0 5px;background:#FAF7F2;color:#4A6B4E;border-radius:4px;font-weight:700}#vesti-install-banner .vib-close{background:transparent;border:0;color:#FAF7F2;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}';
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    var banner = document.createElement('div');
    banner.id = 'vesti-install-banner';
    banner.innerHTML = '<div class="vib-text"><strong>Install Vesti</strong><span>Tap <span class="vib-share">&#x2197;</span> then <em>Add to Home Screen</em></span></div><button class="vib-close" aria-label="Dismiss">&times;</button>';
    document.body.appendChild(banner);
    banner.querySelector('.vib-close').addEventListener('click', function() {
      try { localStorage.setItem('vesti-install-dismissed', '1'); } catch(e){}
      banner.remove();
    });
  })();
  </script>
</body>
</html>
