<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vesti" />
  <meta name="theme-color" content="#fafaf7" />
  <title>Vesti — Sign in</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --bg: #fafaf7;
      --ink: #14110f;
      --muted: #6f6a64;
      --line: #e5e1da;
      --accent-soft: #efeae0;
      --err: #a43030;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(24px + var(--safe-top)) calc(20px + var(--safe-right)) calc(32px + var(--safe-bottom)) calc(20px + var(--safe-left));
    }

    /* ── Brand bar (matches landing + onboarding) ── */
    .brand-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto 64px;
    }
    .v-mark {
      width: 30px;
      height: 30px;
      color: var(--ink);
      flex-shrink: 0;
    }
    .brand-bar .wordmark-text {
      font-family: "SF Pro Display", -apple-system, sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    /* ── Email + magic link ── */
    .input-row { margin-bottom: 12px; }
    .text-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      -webkit-appearance: none;
      transition: border-color .15s ease;
    }
    .text-input::placeholder { color: var(--muted); }
    .text-input:focus { outline: none; border-color: var(--ink); }
    .text-input.has-error { border-color: var(--err); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      font-family: "SF Pro Display", -apple-system, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: opacity .15s ease, background-color .15s ease, color .15s ease;
      border: 1px solid var(--ink);
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { opacity: 0.82; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-outline:hover { border-color: var(--ink); }
    .btn-outline:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Status caption (success / sending) ── */
    .status-text {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin: 10px 0 0;
      min-height: 18px;
    }
    .status-text.is-err { color: var(--err); }

    /* ── Or divider ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 24px;
      color: var(--muted);
      font-size: 13px;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ── 6-box code entry ── */
    .code-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
    }
    .code-box {
      flex: 1;
      max-width: 50px;
      height: 56px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Display", -apple-system, sans-serif;
      font-weight: 600;
      font-size: 20px;
      text-align: center;
      -webkit-appearance: none;
      transition: border-color .15s ease;
    }
    .code-box:focus { outline: none; border-color: var(--ink); }
    .code-box.has-error { border-color: var(--err); }

    .code-status {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin: 0;
      min-height: 18px;
    }
    .code-status.is-err { color: var(--err); }
  </style>
  <!-- PWA / Install -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
</head>
<body>
  <header class="brand-bar">
    <svg class="v-mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="15" cy="15" r="14" stroke="currentColor" stroke-width="1.25"/>
      <path d="M9.5 10L15 21L20.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="wordmark-text">Vesti</span>
  </header>

  <div class="wrap">

    <div class="input-row">
      <input
        id="email-input"
        type="email"
        class="text-input"
        placeholder="you@email.com"
        autocomplete="email"
        inputmode="email"
        spellcheck="false" />
    </div>

    <button id="submit-btn" type="button" class="btn btn-primary">Email me a magic link</button>
    <p id="magic-status" class="status-text" aria-live="polite"></p>

    <div class="or-divider"><span>or</span></div>

    <div class="code-row" role="group" aria-label="6-digit verification code">
      <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" class="code-box" aria-label="Digit 1 of 6" />
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" aria-label="Digit 2 of 6" />
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" aria-label="Digit 3 of 6" />
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" aria-label="Digit 4 of 6" />
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" aria-label="Digit 5 of 6" />
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" aria-label="Digit 6 of 6" />
    </div>

    <button id="verify-btn" type="button" class="btn btn-outline">Verify code</button>
    <p id="code-status" class="code-status" aria-live="polite"></p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (async () => {
      const cfg = await fetch("/api/auth-config").then(r => r.ok ? r.json() : null).catch(() => null);
      if (!cfg || !cfg.url || !cfg.anonKey) return;

      const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: window.localStorage,
          storageKey: "vesti-auth"
        }
      });

      const emailInput  = document.getElementById("email-input");
      const submitBtn   = document.getElementById("submit-btn");
      const magicStatus = document.getElementById("magic-status");
      const verifyBtn   = document.getElementById("verify-btn");
      const codeStatus  = document.getElementById("code-status");
      const codeBoxes   = Array.from(document.querySelectorAll(".code-box"));

      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let lastEmail   = "";
      let resendTimer = null;

      function setMagicStatus(text, isErr) {
        magicStatus.textContent = text || "";
        magicStatus.classList.toggle("is-err", !!isErr);
        emailInput.classList.toggle("has-error", !!isErr);
      }

      function setCodeStatus(text, isErr) {
        codeStatus.textContent = text || "";
        codeStatus.classList.toggle("is-err", !!isErr);
        codeBoxes.forEach(b => b.classList.toggle("has-error", !!isErr));
      }

      function readCode() {
        return codeBoxes.map(b => b.value || "").join("");
      }

      function clearCodeBoxes() {
        codeBoxes.forEach(b => { b.value = ""; b.classList.remove("has-error"); });
      }

      async function sendOtp(email) {
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.origin + "/auth/callback.html" }
        });
        return error;
      }

      // ---- Magic-link button (send + resend on the same button) ----
      submitBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim().toLowerCase();
        setMagicStatus("", false);

        if (!EMAIL_RE.test(email)) {
          setMagicStatus("Please enter a valid email address.", true);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";
        setMagicStatus("", false);

        const error = await sendOtp(email);

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = lastEmail ? "Resend magic link" : "Email me a magic link";
          setMagicStatus(error.message, true);
          return;
        }

        lastEmail = email;
        submitBtn.textContent = "Sent — check your email";
        setMagicStatus("We sent a link and a 6-digit code.", false);

        // Move focus to the first code box so user can type the code immediately.
        setTimeout(() => { if (codeBoxes[0]) codeBoxes[0].focus(); }, 80);

        // 30s cooldown then re-enable as "Resend magic link"
        clearTimeout(resendTimer);
        resendTimer = setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "Resend magic link";
        }, 30000);
      });

      // Enter inside email field triggers send
      emailInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitBtn.click();
      });

      // ---- 6-box code input behavior ----
      codeBoxes.forEach((box, idx) => {
        // Digit input: keep only first digit, auto-advance
        box.addEventListener("input", (e) => {
          const v = (box.value || "").replace(/\D/g, "");
          if (v.length === 0) {
            box.value = "";
            return;
          }
          box.value = v.charAt(0);
          if (codeBoxes[idx + 1]) {
            codeBoxes[idx + 1].focus();
            codeBoxes[idx + 1].select && codeBoxes[idx + 1].select();
          }
          // Auto-submit when all 6 boxes are filled
          if (readCode().length === 6) handleVerify();
        });

        // Backspace on empty box → focus previous and clear it
        box.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !box.value && codeBoxes[idx - 1]) {
            codeBoxes[idx - 1].focus();
            codeBoxes[idx - 1].value = "";
            e.preventDefault();
          } else if (e.key === "ArrowLeft" && codeBoxes[idx - 1]) {
            codeBoxes[idx - 1].focus();
            e.preventDefault();
          } else if (e.key === "ArrowRight" && codeBoxes[idx + 1]) {
            codeBoxes[idx + 1].focus();
            e.preventDefault();
          } else if (e.key === "Enter") {
            handleVerify();
          }
        });

        // Paste anywhere in the row distributes digits across boxes
        box.addEventListener("paste", (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData("text") || "";
          const digits = text.replace(/\D/g, "").slice(0, 6);
          if (!digits) return;
          for (let i = 0; i < 6; i++) {
            codeBoxes[i].value = digits.charAt(i) || "";
          }
          const lastFilled = Math.min(digits.length, 6) - 1;
          if (codeBoxes[lastFilled + 1]) codeBoxes[lastFilled + 1].focus();
          else codeBoxes[5].focus();
          if (digits.length === 6) handleVerify();
        });
      });

      async function handleVerify() {
        const code = readCode();
        setCodeStatus("", false);

        if (!/^\d{6}$/.test(code)) {
          setCodeStatus("Enter the 6-digit code from the email.", true);
          return;
        }
        if (!lastEmail) {
          setCodeStatus("Request a magic link first to receive the code.", true);
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying…";

        try {
          const { data, error } = await sb.auth.verifyOtp({
            email: lastEmail,
            token: code,
            type: "email"
          });
          if (error) throw error;
          if (!data.session) throw new Error("No session returned.");

          const token = data.session.access_token;
          const res = await fetch("/api/get-closet?limit=1", {
            headers: { "Authorization": "Bearer " + token }
          });
          if (res.ok) {
            const closet = await res.json();
            const hasGarments = Array.isArray(closet && closet.garments) && closet.garments.length > 0;
            window.location.href = hasGarments ? "/app.html" : "/onboarding.html";
          } else {
            window.location.href = "/onboarding.html";
          }
        } catch (err) {
          setCodeStatus(err.message || "That code didn't work. Try again or request a new one.", true);
          verifyBtn.disabled = false;
          verifyBtn.textContent = "Verify code";
        }
      }

      verifyBtn.addEventListener("click", handleVerify);

      // Focus email on load
      setTimeout(() => { if (emailInput) emailInput.focus(); }, 60);
    })();
  </script>
  <script>
  (function() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true ||
                       window.matchMedia('(display-mode: standalone)').matches;
    try {
      var dismissed = localStorage.getItem('vesti-install-dismissed') === '1';
      if (!isIOS || isStandalone || dismissed) return;
    } catch (e) { return; }

    var css = '#vesti-install-banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;background:#FAF7F2;color:#2A2A24;border:1px solid #D9D5CC;border-radius:14px;padding:14px 16px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,0.14);display:flex;align-items:flex-start;gap:12px}#vesti-install-banner .vib-text{flex:1}#vesti-install-banner .vib-text strong{display:block;font-weight:600;margin-bottom:4px;color:#4A6B4E}#vesti-install-banner .vib-share{display:inline-block;padding:1px 5px;background:#4A6B4E;color:#FAF7F2;border-radius:4px;font-weight:700}#vesti-install-banner .vib-close{min-width:32px;min-height:32px;border-radius:8px;background:rgba(0,0,0,0.05);border:0;color:#6f6a64;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}';
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    var banner = document.createElement('div');
    banner.id = 'vesti-install-banner';
    banner.setAttribute('role', 'note');
    banner.innerHTML = '<div class="vib-text"><strong>Add Vesti to your Home Screen</strong><span>In Safari, tap the Share icon <span class="vib-share">&#x2197;</span> at the bottom, then choose <em>Add to Home Screen</em>.</span></div><button class="vib-close" aria-label="Dismiss">&times;</button>';
    document.body.appendChild(banner);
    banner.querySelector('.vib-close').addEventListener('click', function() {
      try { localStorage.setItem('vesti-install-dismissed', '1'); } catch(e){}
      banner.remove();
    });
  })();
  </script>
</body>
</html>
